name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build
        env:
          VITE_CONTACT_FORM_ENDPOINT: ${{ secrets.VITE_CONTACT_FORM_ENDPOINT }}
        run: |
          npm ci
          npm run build

      - name: Sync static assets to S3 (cache-friendly)
        env:
          BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
        run: |
          set -euo pipefail
          test -n "${BUCKET:-}" || { echo "::error::FRONTEND_S3_BUCKET secret is empty or missing"; exit 1; }

          aws s3 sync dist/assets/ "s3://${BUCKET}/assets/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

          aws s3 sync dist/ "s3://${BUCKET}/" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=300"

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFRONT_DISTRIBUTION_ID:-}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
              --paths "/index.html" "/assets/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID not set; skipping CloudFront invalidation"
          fi
